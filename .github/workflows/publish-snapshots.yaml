name: Publish Snapshots

run-name: Publish snapshot for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - Build all
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-package:
    name: Build snapshot package
    # Manual runs bypass CI validation; automatic runs require a successful push build on the release branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == (vars.SNAPSHOT_RELEASE_BRANCH || 'master')
      )
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    concurrency:
      group: package-snapshots-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false

    steps:
      - name: Checkout publish commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PUBLISH_SHA }}
          # Keep full main-repository history so publish.ps1 can extract the Git revision count.
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout shallow submodules
        run: git submodule update --init --recursive --depth 1

      - name: Build runtime package
        shell: pwsh
        run: ./publish.ps1 -OfficialBuild $true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-package
          path: publish/**/OIV-*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish snapshot release
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-snapshots-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: ${{ github.event.repository.fork && github.repository || format('{0}/snapshots', github.repository_owner) }}
      RELEASE_TAG: snapshot-${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_TARGET: ${{ github.event.repository.fork && (github.event.workflow_run.head_sha || github.sha) || '' }}

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: snapshot-package
          path: snapshot-package

      - name: Select downloaded archives
        id: package
        shell: pwsh
        run: |
          $archivePattern = '^OIV-.+(?:\.[^.]+)+$'
          $symbolsPattern = '-Symbols(?:\.[^.]+)+$'
          $archives = @(Get-ChildItem -Path "snapshot-package" -Recurse -File | Where-Object { $_.Name -match $archivePattern })
          $runtimeArchives = @($archives | Where-Object { $_.Name -notmatch $symbolsPattern })
          $symbolsArchives = @($archives | Where-Object { $_.Name -match $symbolsPattern })

          if ($runtimeArchives.Count -ne 1) {
              $archiveList = if ($runtimeArchives.Count -eq 0) { "<none>" } else { ($runtimeArchives | ForEach-Object { $_.FullName }) -join "`n" }
              throw "Expected exactly one runtime archive, found $($runtimeArchives.Count):`n$archiveList"
          }

          if ($symbolsArchives.Count -ne 1) {
              $archiveList = if ($symbolsArchives.Count -eq 0) { "<none>" } else { ($symbolsArchives | ForEach-Object { $_.FullName }) -join "`n" }
              throw "Expected exactly one symbols archive, found $($symbolsArchives.Count):`n$archiveList"
          }

          $runtimeArchive = $runtimeArchives[0]
          $symbolsArchive = $symbolsArchives[0]
          $titlePattern = '^(?<title>OIV-\d+(?:\.\d+)+-[0-9a-f]+)(?:-.+)?(?:\.[^.]+)+$'
          if ($runtimeArchive.Name -notmatch $titlePattern) {
              throw "Runtime archive name '$($runtimeArchive.Name)' does not contain an OIV version and commit prefix."
          }

          $releaseTitle = $Matches.title
          "runtime_archive_path=$($runtimeArchive.FullName)" >> $env:GITHUB_OUTPUT
          "runtime_archive_name=$($runtimeArchive.Name)" >> $env:GITHUB_OUTPUT
          "symbols_archive_path=$($symbolsArchive.FullName)" >> $env:GITHUB_OUTPUT
          "symbols_archive_name=$($symbolsArchive.Name)" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "Selected runtime archive $($runtimeArchive.FullName)"
          "Selected symbols archive $($symbolsArchive.FullName)"
          "Release title $releaseTitle"

      - name: Publish snapshot release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.event.repository.fork && github.token || secrets.SNAPSHOTS_TOKEN }}
          RELEASE_TITLE: ${{ steps.package.outputs.release_title }}
          RUNTIME_ARCHIVE_PATH: ${{ steps.package.outputs.runtime_archive_path }}
          RUNTIME_ARCHIVE_NAME: ${{ steps.package.outputs.runtime_archive_name }}
          SYMBOLS_ARCHIVE_PATH: ${{ steps.package.outputs.symbols_archive_path }}
          SYMBOLS_ARCHIVE_NAME: ${{ steps.package.outputs.symbols_archive_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable -Name PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
              $PSNativeCommandUseErrorActionPreference = $true
          }

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
              throw "Release token is not configured."
          }

          $notes = "Source commit: $env:PUBLISH_SHA"

          $releaseExists = $true
          try {
              gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY *> $null
          } catch {
              $releaseExists = $false
          }

          if (-not $releaseExists) {
              $createArgs = @(
                  "release", "create", $env:RELEASE_TAG,
                  "--repo", $env:RELEASE_REPOSITORY,
                  "--title", $env:RELEASE_TITLE,
                  "--notes", $notes,
                  "--prerelease"
              )
              if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TARGET)) {
                  $createArgs += @("--target", $env:RELEASE_TARGET)
              }
              gh @createArgs
          } else {
              gh release edit $env:RELEASE_TAG `
                  --repo $env:RELEASE_REPOSITORY `
                  --title $env:RELEASE_TITLE `
                  --notes $notes `
                  --prerelease

              $release = gh release view $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --json assets | ConvertFrom-Json
              foreach ($asset in @($release.assets)) {
                  gh release delete-asset $env:RELEASE_TAG $asset.name --repo $env:RELEASE_REPOSITORY --yes
              }
          }

          gh release upload $env:RELEASE_TAG $env:RUNTIME_ARCHIVE_PATH $env:SYMBOLS_ARCHIVE_PATH `
              --repo $env:RELEASE_REPOSITORY

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Published snapshot assets to $env:RELEASE_REPOSITORY release '$env:RELEASE_TAG' for $env:PUBLISH_SHA: $env:RUNTIME_ARCHIVE_NAME, $env:SYMBOLS_ARCHIVE_NAME."
