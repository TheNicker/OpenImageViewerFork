name: Build all

on:
  push:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yaml

  build-linux-tests:
    uses: ./.github/workflows/build-linux-tests.yaml
